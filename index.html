<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Számrendszer átváltó</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Számrendszer <span>átváltó</span></h1>
        <p>kettes · tízes · tizenhatos</p>
        <div style="margin-top: 15px;">
            <a href="dokumentacio.html" class="kis-gomb">Dokumentáció</a>
            <a href="tesztek.html" class="kis-gomb">Tesztesetek</a>
        </div>
    </header>

    <main>
        <div class="bal">
            <section class="kartya">
                <h2>Átváltó</h2>

                <label for="szam">Szám</label>
                <input type="text" id="szam" placeholder="pl. 1F, 101, 255" autocomplete="off" spellcheck="false" maxlength="24">

                <div class="ket-oszlop">
                    <div>
                        <label for="alap">Milyen számrendszerben van?</label>
                        <select id="alap">
                            <option value="0">Döntse el magától</option>
                            <option value="2">Kettes</option>
                            <option value="10">Tízes</option>
                            <option value="16">Tizenhatos</option>
                        </select>
                    </div>
                    <div>
                        <label for="cel">Melyikbe váltsa át?</label>
                        <select id="cel">
                            <option value="2">Kettes</option>
                            <option value="10">Tízes</option>
                            <option value="16">Tizenhatos</option>
                        </select>
                    </div>
                </div>

                <button id="gomb">Átváltás</button>

                <p id="eredmeny"></p>
            </section>

        </div>
    </main>

    <footer>Számrendszer átváltó</footer>

    <script src="script.js"></script>
</body>
</html>
